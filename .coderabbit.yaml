# CodeRabbit PR review config. Schema: https://coderabbit.ai/integrations/schema.v2.json
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!internal/data/db/**"        # sqlc-generated
    - "!web/src/api/generated.ts"   # generated from OpenAPI by orval
    - "!api/openapi.json"           # generated by huma
    - "!**/pnpm-lock.yaml"
    - "!**/uv.lock"
    - "!go.sum"
    - "!testdata/benchmark/*.csv"   # vectorbt golden files: regenerated, reviewed as data
    - "!v0/**"                      # V0 research scripts, not product code
  path_instructions:
    - path: "internal/{backtest,patterns,rules}/**"
      instructions: |
        This is the trading engine. Check for: look-ahead (any use of bar t+1 data, or data after t's close, when evaluating bar t);
        fills other than the next bar's open; signals that don't require t-1 to be evaluable and false (spec §5.5);
        float comparisons without a tolerance; map iteration order leaking into outputs (results must be deterministic);
        duration params in bars instead of calendar units (spec §5.3). Cite the spec section when flagging.
    - path: "internal/api/**"
      instructions: |
        Every input must be validated through huma. Demo mode must never write (systems endpoints return 403).
        Rate-limited routes: backtest, scan, quickscan, report, bars. Errors use RFC 9457 problem JSON.
    - path: "internal/{data,ingest}/**"
      instructions: |
        SQLite WAL via modernc (no cgo). Check transactions around bulk writes, the split/restatement full refetch (spec §6.1),
        and that a failed symbol writes nothing.
    - path: "web/**"
      instructions: |
        React 19 + TanStack Router/Query. Server state only through TanStack Query; the builder draft through its reducer.
        Evidence rendering must switch exhaustively on `type`. Every localStorage access wrapped in try/catch.
    - path: "docs/**"
      instructions: "Check consistency with docs/superpowers/specs and docs/adr. Flag contradictions, not style."
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: local
