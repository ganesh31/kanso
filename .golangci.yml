# golangci-lint v2 config (CI pins v2.15.0). Formatting is checked separately: gofumpt -l must be empty.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
    revive:
      rules:
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: strict # internal/data/db (sqlc)
    presets:
      - std-error-handling
    rules:
      # The API tests close bodies inside their request helpers, which bodyclose can't follow.
      - path: _test\.go
        linters: [bodyclose]
    paths:
      - v0/
