<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky toolbar (search, V1 filter, section jumps) over a single reading column of term rows on faint chart-grid paper. */
:root {
  --paper: #f4f6f9; --card: #ffffff; --ink: #142030; --muted: #586679; --rule: #dbe1ea;
  --grid: rgba(20, 32, 48, .045); --accent: #0b7a55; --accent-soft: #e2f3ec; --hl: #fff3c4;
  --pop-bg: #142030; --pop-ink: #eef3f8; --pop-muted: #a9b6c6;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d131a; --card: #131b25; --ink: #e5ecf4; --muted: #94a3b5; --rule: #233041;
  --grid: rgba(229, 236, 244, .035); --accent: #3cc28e; --accent-soft: #173327; --hl: #3a3313;
  --pop-bg: #e8eef5; --pop-ink: #111a24; --pop-muted: #4c5a6b; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0d131a; --card: #131b25; --ink: #e5ecf4; --muted: #94a3b5; --rule: #233041;
  --grid: rgba(229, 236, 244, .035); --accent: #3cc28e; --accent-soft: #173327; --hl: #3a3313;
  --pop-bg: #e8eef5; --pop-ink: #111a24; --pop-muted: #4c5a6b; color-scheme: dark }

* { box-sizing: border-box }
body {
  background: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink); font: 15px/1.6 var(--f-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper) }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule) }
header.top .wrap { padding-block: 18px 12px; display: grid; gap: 12px }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap }
h1 { font: 800 clamp(22px, 4vw, 30px)/1.1 var(--f-display); letter-spacing: -.01em; margin: 0; text-wrap: balance }
h1 .tick { color: var(--accent) }
.count { font: 500 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
#q { flex: 1 1 240px; min-width: 0; font: 15px var(--f-body); color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px }
#q:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.toggle { display: inline-flex; align-items: center; gap: 8px; font: 500 13px var(--f-body); color: var(--muted); cursor: pointer; user-select: none }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px }
nav.jumps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin }
nav.jumps a { flex: none; font: 500 12px/1 var(--f-body); color: var(--muted); text-decoration: none; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--card) }
nav.jumps a:hover { color: var(--ink); border-color: var(--muted) }

main .wrap { padding-block: 8px 64px }
.intro { color: var(--muted); max-width: 65ch; margin: 18px 0 8px }
.intro .v1 { vertical-align: 1px }
section.sec { margin-top: 34px }
section.sec > h2 { font: 600 13px/1 var(--f-display); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 10px; display: flex; gap: 10px; align-items: center }
section.sec > h2::after { content: ""; flex: 1; height: 1px; background: var(--rule) }
.list { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden }
.entry { display: grid; grid-template-columns: minmax(0, 13.5em) minmax(0, 1fr); gap: 4px 20px; padding: 14px 18px; border-top: 1px solid var(--rule); scroll-margin-top: 170px; transition: background .6s }
.entry:first-child { border-top: 0 }
.entry.flash { background: var(--hl) }
.entry h3 { margin: 0; font: 600 15px/1.35 var(--f-body); display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline }
.entry h3 a.self { color: inherit; text-decoration: none }
.entry h3 a.self:hover { text-decoration: underline; text-decoration-color: var(--rule) }
.v1 { font: 500 10px/1 var(--f-mono); letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 3px 5px }
.def { margin: 0; min-width: 0; max-width: 65ch }
.def code { font: 13px var(--f-mono); background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px }
a.xref { color: inherit; text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help }
a.xref:hover { color: var(--accent) }
.empty { color: var(--muted); padding: 24px 0 }
@media (max-width: 560px) { .entry { grid-template-columns: minmax(0, 1fr) } }

#pop { position: fixed; z-index: 20; max-width: min(360px, calc(100vw - 32px)); background: var(--pop-bg); color: var(--pop-ink); border-radius: 10px; padding: 12px 14px; font: 14px/1.5 var(--f-body); box-shadow: 0 8px 28px rgba(0,0,0,.22); pointer-events: auto }
#pop .t { font: 600 14px var(--f-body); margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline }
#pop .s { font: 500 11px var(--f-mono); color: var(--pop-muted) }
#pop code { font: 12px var(--f-mono) }
#pop a.go { display: inline-block; margin-top: 6px; color: var(--pop-ink); font-size: 12px; opacity: .8 }
@media (prefers-reduced-motion: reduce) { .entry { transition: none } }
</style>

<header class="top">

<main>
  <div class="wrap">
    <p class="intro">Plain-English definitions for multi-year breakout trading on NSE. Dotted words inside a definition are other glossary terms: hover or tap one to read it without losing your place. <span class="v1">V1</span> marks terms Kanso V1 uses directly.</p>
    <div id="body"></div>
  </div>
</main>
<div id="pop" role="tooltip" hidden></div>

<script>
const DATA = {"sections": ["Market basics", "Price data and charts", "Adjustments (why old prices change)", "Levels, patterns and breakouts", "Volume, strength and indicators", "Trading and execution", "Backtesting and performance", "Alternative chart types (V2)", "Derivatives (not in V1, but you'll hear these)", "Tools mentioned in Kanso"], "terms": [{"id": "nse", "term": "NSE / BSE", "aliases": ["NSE", "BSE"], "link": ["NSE", "BSE"], "section": "Market basics", "v1": true, "def": "India's two stock exchanges: the National Stock Exchange and the Bombay Stock Exchange. Most trading happens on NSE."}, {"id": "stock", "term": "Stock / share / equity", "aliases": ["Stock", "share", "equity"], "link": [], "section": "Market basics", "v1": false, "def": "A small piece of ownership in a company. \"Equity\" also means stocks as a category."}, {"id": "scrip", "term": "Scrip", "aliases": ["Scrip"], "link": ["Scrip"], "section": "Market basics", "v1": false, "def": "Indian broker jargon for a single stock. \"Scrip report\" = a report on one stock."}, {"id": "symbol", "term": "Symbol / ticker", "aliases": ["Symbol", "ticker"], "link": [], "section": "Market basics", "v1": true, "def": "A stock's short code, e.g. <code>RELIANCE</code>. Yahoo adds <code>.NS</code> for NSE (<code>RELIANCE.NS</code>) and TradingView adds a prefix (<code>NSE:RELIANCE</code>)."}, {"id": "index", "term": "Index", "aliases": ["Index"], "link": [], "section": "Market basics", "v1": true, "def": "A number tracking a basket of stocks, like a \"market average\". It isn't a stock you can buy directly."}, {"id": "nifty-50", "term": "Nifty 50", "aliases": ["Nifty 50"], "link": ["Nifty 50"], "section": "Market basics", "v1": true, "def": "Index of the 50 largest NSE companies, the standard measure of how \"the market\" did. Yahoo ticker <code>^NSEI</code>. Kanso compares against it (the benchmark)."}, {"id": "nifty-500", "term": "Nifty 500", "aliases": ["Nifty 500"], "link": ["Nifty 500"], "section": "Market basics", "v1": true, "def": "Index of the 500 largest NSE companies. Kanso's default stock list."}, {"id": "constituents", "term": "Constituents", "aliases": ["Constituents"], "link": ["Constituents"], "section": "Market basics", "v1": true, "def": "The stocks currently inside an index. They change over time as companies are added and removed."}, {"id": "universe", "term": "Universe / stock list", "aliases": ["Universe", "stock list"], "link": ["Universe", "stock list"], "section": "Market basics", "v1": true, "def": "The set of stocks a scan or backtest runs over, e.g. \"Nifty 500\"."}, {"id": "large", "term": "Large / mid / small cap", "aliases": ["Large", "mid", "small cap"], "link": ["Large", "mid", "small cap"], "section": "Market basics", "v1": false, "def": "Company size by market value (\"market capitalisation\"). Small caps move more and are riskier."}, {"id": "sector", "term": "Sector", "aliases": ["Sector"], "link": [], "section": "Market basics", "v1": false, "def": "Industry group, e.g. banking, IT, pharma."}, {"id": "demat-account", "term": "Demat account", "aliases": ["Demat account"], "link": ["Demat account"], "section": "Market basics", "v1": false, "def": "The account that holds your shares electronically. You need one to buy stocks in India."}, {"id": "broker", "term": "Broker", "aliases": ["Broker"], "link": [], "section": "Market basics", "v1": false, "def": "The company that places your orders on the exchange (Zerodha, Definedge, etc.)."}, {"id": "market-hours", "term": "Market hours", "aliases": ["Market hours"], "link": ["Market hours"], "section": "Market basics", "v1": false, "def": "NSE trades 9:15 am – 3:30 pm IST, Monday to Friday, except holidays."}, {"id": "eod", "term": "EOD (end of day)", "aliases": ["EOD", "end of day"], "link": ["EOD", "end of day"], "section": "Market basics", "v1": true, "def": "Data published after the market closes: one bar per stock per day. Kanso V1 uses EOD only."}, {"id": "bhavcopy", "term": "Bhavcopy", "aliases": ["Bhavcopy"], "link": ["Bhavcopy"], "section": "Market basics", "v1": false, "def": "NSE's official end-of-day price file for all stocks. eod2 builds its data from it."}, {"id": "trading-day", "term": "Trading day", "aliases": ["Trading day"], "link": [], "section": "Market basics", "v1": true, "def": "A day the exchange is open. A year has about <strong>252</strong> of them, which is where Kanso's \"3 years = 756 bars\" comes from."}, {"id": "ohlc", "term": "OHLC / OHLCV", "aliases": ["OHLC", "OHLCV"], "link": ["OHLC", "OHLCV"], "section": "Price data and charts", "v1": true, "def": "Open, High, Low, Close (+ Volume) for a period. This is the raw data Kanso stores."}, {"id": "open", "term": "Open", "aliases": ["Open"], "link": [], "section": "Price data and charts", "v1": true, "def": "First traded price of the period. Kanso buys at the <strong>next day's open</strong> after a signal."}, {"id": "high", "term": "High / Low", "aliases": ["High", "Low"], "link": [], "section": "Price data and charts", "v1": false, "def": "Highest and lowest price traded during the period."}, {"id": "close", "term": "Close", "aliases": ["Close"], "link": [], "section": "Price data and charts", "v1": true, "def": "Last price of the period. Most signals use the close, because it's the \"settled\" price for the day."}, {"id": "volume", "term": "Volume", "aliases": ["Volume"], "link": ["Volume"], "section": "Price data and charts", "v1": true, "def": "How many shares changed hands during the period."}, {"id": "bar", "term": "Bar", "aliases": ["Bar"], "link": [], "section": "Price data and charts", "v1": true, "def": "One period's OHLCV, whether a day, a week or a month. \"756 bars\" = 756 trading days on a daily chart."}, {"id": "candle", "term": "Candle / candlestick", "aliases": ["Candle", "candlestick"], "link": ["Candle", "candlestick"], "section": "Price data and charts", "v1": false, "def": "The usual way to draw a bar. The thick <strong>body</strong> spans open to close (green if close &gt; open, red if lower), and thin <strong>wicks</strong> reach to the high and low."}, {"id": "line-chart", "term": "Line chart", "aliases": ["Line chart"], "link": [], "section": "Price data and charts", "v1": false, "def": "Just the closes joined by a line."}, {"id": "timeframe", "term": "Timeframe", "aliases": ["Timeframe"], "link": ["Timeframe"], "section": "Price data and charts", "v1": true, "def": "How long each bar covers: daily, weekly, monthly. A <strong>weekly</strong> bar = Monday's open, the week's high and low, Friday's close, and the total volume."}, {"id": "gap-up", "term": "Gap up / gap down", "aliases": ["Gap up", "gap down"], "link": ["Gap up", "gap down"], "section": "Price data and charts", "v1": true, "def": "Today opens well above (or below) yesterday's close, with no trading in between. It matters for stop-losses (see §6)."}, {"id": "intraday", "term": "Intraday", "aliases": ["Intraday"], "link": [], "section": "Price data and charts", "v1": false, "def": "Within a single trading day, e.g. 5-minute bars. Not used in Kanso V1."}, {"id": "corporate-action", "term": "Corporate action", "aliases": ["Corporate action"], "link": ["Corporate action"], "section": "Adjustments (why old prices change)", "v1": false, "def": "Something a company does that changes its share count or price: a split, a bonus or a dividend."}, {"id": "stock-split", "term": "Stock split", "aliases": ["Stock split"], "link": ["Stock split"], "section": "Adjustments (why old prices change)", "v1": true, "def": "One share becomes several, e.g. 1 share of ₹1,000 → 2 shares of ₹500. The company's value doesn't change, only the price per share."}, {"id": "bonus-issue", "term": "Bonus issue", "aliases": ["Bonus issue"], "link": ["Bonus issue"], "section": "Adjustments (why old prices change)", "v1": true, "def": "Free extra shares to existing holders, e.g. 1:1. The effect on the price is like a split."}, {"id": "dividend", "term": "Dividend", "aliases": ["Dividend"], "link": ["Dividend"], "section": "Adjustments (why old prices change)", "v1": false, "def": "Cash the company pays shareholders. The price drops by about that amount on the \"ex-date\"."}, {"id": "adjusted-prices", "term": "Adjusted prices", "aliases": ["Adjusted prices"], "link": ["Adjusted prices"], "section": "Adjustments (why old prices change)", "v1": true, "def": "Historical prices rescaled so splits and bonuses don't show up as fake crashes. Without this, a 1:2 split looks like a 50% fall, and old highs look twice as high as they really were. Kanso uses <strong>split-adjusted</strong> prices."}, {"id": "resistance", "term": "Resistance / ceiling", "aliases": ["Resistance", "ceiling"], "link": ["Resistance", "ceiling"], "section": "Levels, patterns and breakouts", "v1": true, "def": "A price level where selling has repeatedly stopped the stock from going higher."}, {"id": "support", "term": "Support / floor", "aliases": ["Support", "floor"], "link": ["Support", "floor"], "section": "Levels, patterns and breakouts", "v1": false, "def": "A price level where buying has repeatedly stopped the stock from falling."}, {"id": "all-time-high", "term": "All-time high (ATH)", "aliases": ["All-time high", "ATH"], "link": ["All-time high", "ATH"], "section": "Levels, patterns and breakouts", "v1": true, "def": "The highest price ever. Kanso's \"all-time\" setting needs at least 2 years of history."}, {"id": "52-week-high", "term": "52-week high", "aliases": ["52-week high"], "link": ["52-week high"], "section": "Levels, patterns and breakouts", "v1": false, "def": "Highest price in the last year. The most common version of \"new high\"."}, {"id": "n-year-high", "term": "N-year high", "aliases": ["N-year high"], "link": ["N-year high"], "section": "Levels, patterns and breakouts", "v1": true, "def": "Highest <em>high</em> in the last N years. Kanso's core pattern: today's close is above the highest high of the prior N years."}, {"id": "breakout", "term": "Breakout", "aliases": ["Breakout"], "link": ["Breakout"], "section": "Levels, patterns and breakouts", "v1": true, "def": "The price closes above a resistance level. A <strong>multi-year breakout</strong> clears a ceiling that has held for years. Example: DIVISLAB, Sept 2024, cleared its Oct 2021 high of ₹5,425."}, {"id": "breakout-level", "term": "Breakout level", "aliases": ["Breakout level"], "link": ["Breakout level"], "section": "Levels, patterns and breakouts", "v1": true, "def": "The exact price being broken, e.g. ₹5,425. Kanso draws it as a line on the chart."}, {"id": "breakdown", "term": "Breakdown", "aliases": ["Breakdown"], "link": ["Breakdown"], "section": "Levels, patterns and breakouts", "v1": false, "def": "The mirror image of a breakout: a close below support."}, {"id": "base", "term": "Base / consolidation", "aliases": ["Base", "consolidation"], "link": ["Base", "consolidation"], "section": "Levels, patterns and breakouts", "v1": true, "def": "A long sideways stretch under a ceiling. Longer bases often lead to stronger breakouts. DIVISLAB's base ran 2022–2024."}, {"id": "overhead-supply", "term": "Overhead supply", "aliases": ["Overhead supply"], "link": ["Overhead supply"], "section": "Levels, patterns and breakouts", "v1": false, "def": "People who bought near the old high and are waiting to sell once they're back to even. This is why ceilings hold, and why clearing one matters."}, {"id": "false-breakout", "term": "False breakout / fakeout", "aliases": ["False breakout", "fakeout"], "link": ["False breakout", "fakeout"], "section": "Levels, patterns and breakouts", "v1": true, "def": "The stock pokes above the level and then falls back below it. This is what filters and stop-losses guard against."}, {"id": "close-confirmation", "term": "Close confirmation", "aliases": ["Close confirmation"], "link": ["Close confirmation"], "section": "Levels, patterns and breakouts", "v1": true, "def": "Waiting for a close above the level, daily or <strong>weekly</strong>, rather than just a brief poke above it during the day."}, {"id": "extended", "term": "Extended", "aliases": ["Extended"], "link": ["Extended"], "section": "Levels, patterns and breakouts", "v1": true, "def": "The price has already run far above the breakout level, so buying now is late and the stop is far away. Kanso's \"not extended\" filter: no more than 8% above the level."}, {"id": "continuation-high", "term": "Continuation high", "aliases": ["Continuation high"], "link": ["Continuation high"], "section": "Levels, patterns and breakouts", "v1": true, "def": "A new high in a stock that's already rising, where the \"old high\" is only days old. It isn't a base breakout, and V0 found far more of these than real breakouts."}, {"id": "retest", "term": "Retest", "aliases": ["Retest"], "link": ["Retest"], "section": "Levels, patterns and breakouts", "v1": false, "def": "After a breakout, the price dips back to the old ceiling, which now acts as support, before moving up again."}, {"id": "swing-high", "term": "Swing high / swing low (pivot)", "aliases": ["Swing high", "swing low", "pivot"], "link": ["Swing high", "swing low", "pivot"], "section": "Levels, patterns and breakouts", "v1": false, "def": "A local peak or trough on the chart. You need these to detect patterns like double tops. (V2)"}, {"id": "tested-ceiling", "term": "Tested ceiling", "aliases": ["Tested ceiling"], "link": ["Tested ceiling"], "section": "Levels, patterns and breakouts", "v1": false, "def": "A resistance level the price has touched several times. More touches mean more meaningful resistance. (V2 pattern)"}, {"id": "double-top", "term": "Double top / triple top", "aliases": ["Double top", "triple top"], "link": ["Double top", "triple top"], "section": "Levels, patterns and breakouts", "v1": false, "def": "Two or three peaks at about the same level. Breaking above them is a \"double top buy\" in Point &amp; Figure terms."}, {"id": "cup-and-handle", "term": "Cup and handle", "aliases": ["Cup and handle"], "link": ["Cup and handle"], "section": "Levels, patterns and breakouts", "v1": false, "def": "A rounded \"U\" base followed by a small dip, then a breakout."}, {"id": "triangle", "term": "Triangle", "aliases": ["Triangle"], "link": ["Triangle"], "section": "Levels, patterns and breakouts", "v1": false, "def": "Highs falling and/or lows rising, so the range narrows toward a breakout."}, {"id": "vcp", "term": "VCP (volatility contraction pattern)", "aliases": ["VCP", "volatility contraction pattern"], "link": ["VCP", "volatility contraction pattern"], "section": "Levels, patterns and breakouts", "v1": false, "def": "Swings that get smaller and tighter before a breakout (from Mark Minervini). Skipped in V1 because it's hard to define objectively."}, {"id": "nr7", "term": "NR7", "aliases": ["NR7"], "link": ["NR7"], "section": "Levels, patterns and breakouts", "v1": false, "def": "\"Narrowest range of the last 7 days\", a sign of calm before a move."}, {"id": "average-volume", "term": "Average volume", "aliases": ["Average volume"], "link": ["Average volume"], "section": "Volume, strength and indicators", "v1": false, "def": "Typical daily volume, e.g. the 50-day average."}, {"id": "volume-surge", "term": "Volume surge", "aliases": ["Volume surge"], "link": ["Volume surge"], "section": "Volume, strength and indicators", "v1": true, "def": "Volume well above average, e.g. <strong>2×</strong> the 50-day average. A breakout on a surge suggests big buyers are involved. INFY's failed 2024 breakout came on 0.73×, below average."}, {"id": "relative-strength", "term": "Relative strength (RS)", "aliases": ["Relative strength", "RS"], "link": ["Relative strength", "RS"], "section": "Volume, strength and indicators", "v1": true, "def": "How a stock did <em>compared with</em> the market. Kanso's version: the stock's 6-month return minus the Nifty 50's. Positive = it's beating the market."}, {"id": "rsi", "term": "RSI", "aliases": ["RSI"], "link": ["RSI"], "section": "Volume, strength and indicators", "v1": false, "def": "<em>Different from RS!</em> The \"Relative Strength Index\", a 0–100 momentum gauge of recent ups vs downs. Above 70 = \"overbought\", below 30 = \"oversold\". Not used in V1."}, {"id": "momentum", "term": "Momentum", "aliases": ["Momentum"], "link": ["Momentum"], "section": "Volume, strength and indicators", "v1": false, "def": "The tendency of stocks that have been rising to keep rising for a while. Breakout trading is a form of momentum trading."}, {"id": "leader", "term": "Leader / laggard", "aliases": ["Leader", "laggard"], "link": [], "section": "Volume, strength and indicators", "v1": false, "def": "Stocks beating the market vs lagging it."}, {"id": "market-breadth", "term": "Market breadth", "aliases": ["Market breadth"], "link": ["Market breadth"], "section": "Volume, strength and indicators", "v1": false, "def": "How many stocks are rising vs falling overall: a health check for the whole market."}, {"id": "moving-average-ma", "term": "Moving average (MA / SMA)", "aliases": ["Moving average (MA", "SMA)"], "link": ["Moving average (MA", "SMA)"], "section": "Volume, strength and indicators", "v1": true, "def": "The average close over the last N bars, drawn as a smooth line. <strong>SMA</strong> = simple moving average. Kanso's trend exit: the weekly close falls below the <strong>30-week SMA</strong>."}, {"id": "ema", "term": "EMA", "aliases": ["EMA"], "link": ["EMA"], "section": "Volume, strength and indicators", "v1": false, "def": "Exponential moving average: like an SMA, but recent prices count more."}, {"id": "atr", "term": "ATR", "aliases": ["ATR"], "link": ["ATR"], "section": "Volume, strength and indicators", "v1": false, "def": "Average True Range: how much a stock typically moves per bar. Used for volatility-based stops and Renko brick sizes."}, {"id": "volatility", "term": "Volatility", "aliases": ["Volatility"], "link": [], "section": "Volume, strength and indicators", "v1": false, "def": "How much a price swings. Higher volatility means bigger moves both ways."}, {"id": "long", "term": "Long / short", "aliases": ["Long", "short"], "link": [], "section": "Trading and execution", "v1": false, "def": "Long = you buy, hoping the price rises. Short = you sell first, hoping it falls. Kanso V1 is long-only."}, {"id": "position", "term": "Position", "aliases": ["Position"], "link": [], "section": "Trading and execution", "v1": true, "def": "A holding you currently have, e.g. \"100 shares of DIVISLAB\"."}, {"id": "entry", "term": "Entry / exit", "aliases": ["Entry", "exit"], "link": [], "section": "Trading and execution", "v1": true, "def": "Buying into and selling out of a position."}, {"id": "signal", "term": "Signal", "aliases": ["Signal"], "link": ["Signal"], "section": "Trading and execution", "v1": true, "def": "The moment a rule says \"buy\" or \"sell\". In Kanso, a signal fires on the <strong>first</strong> day the rule becomes true (\"edge-triggered\"), not every day it stays true."}, {"id": "fill", "term": "Fill / fill price", "aliases": ["Fill", "fill price"], "link": [], "section": "Trading and execution", "v1": true, "def": "The price you actually got. Kanso assumes the <strong>next day's open</strong>, because you can't trade at the close you only just saw."}, {"id": "market-order", "term": "Market order", "aliases": ["Market order"], "link": [], "section": "Trading and execution", "v1": false, "def": "\"Buy now at whatever the price is\". The fill can be worse than the price on screen."}, {"id": "slippage", "term": "Slippage", "aliases": ["Slippage"], "link": ["Slippage"], "section": "Trading and execution", "v1": true, "def": "The gap between the price you expected and the price you got. Kanso assumes 0.10% per side."}, {"id": "brokerage-and-charges", "term": "Brokerage and charges", "aliases": ["Brokerage and charges"], "link": ["Brokerage and charges"], "section": "Trading and execution", "v1": true, "def": "Broker fees plus government charges (STT, stamp duty, exchange fees). Kanso assumes 0.20% per side in total."}, {"id": "stt", "term": "STT", "aliases": ["STT"], "link": ["STT"], "section": "Trading and execution", "v1": false, "def": "Securities Transaction Tax, an Indian tax on each trade."}, {"id": "per-side", "term": "Per side / round trip", "aliases": ["Per side", "round trip"], "link": ["Per side", "round trip"], "section": "Trading and execution", "v1": true, "def": "\"Per side\" = buying OR selling. A round trip = buy + sell, so it costs twice the per-side cost."}, {"id": "stop-loss", "term": "Stop-loss", "aliases": ["Stop-loss"], "link": ["Stop-loss"], "section": "Trading and execution", "v1": true, "def": "A pre-set exit if the price falls to a certain level, which limits the loss. Kanso default: 8% below your buy price."}, {"id": "gap-through-the-stop", "term": "Gap through the stop", "aliases": ["Gap through the stop"], "link": ["Gap through the stop"], "section": "Trading and execution", "v1": true, "def": "The stock opens <em>below</em> your stop, so you get out at the (worse) open price, not at your stop price. Kanso models this honestly."}, {"id": "trailing-stop", "term": "Trailing stop / trend exit", "aliases": ["Trailing stop", "trend exit"], "link": ["Trailing stop", "trend exit"], "section": "Trading and execution", "v1": true, "def": "An exit that rises as the price rises, so winners keep running and you sell only when the trend breaks. Kanso: weekly close below the 30-week SMA."}, {"id": "risk-per-trade", "term": "Risk per trade", "aliases": ["Risk per trade"], "link": ["Risk per trade"], "section": "Trading and execution", "v1": false, "def": "How much of your capital you lose if the stop is hit."}, {"id": "position-sizing", "term": "Position sizing", "aliases": ["Position sizing"], "link": ["Position sizing"], "section": "Trading and execution", "v1": true, "def": "How much money goes into each trade. Kanso: equal slices, e.g. capital ÷ 10 positions."}, {"id": "slots", "term": "Slots / max positions", "aliases": ["Slots", "max positions"], "link": ["Slots", "max positions"], "section": "Trading and execution", "v1": true, "def": "How many stocks you can hold at once. When more signals arrive than there are free slots, Kanso takes the ones with the highest RS first."}, {"id": "liquidity", "term": "Liquidity", "aliases": ["Liquidity"], "link": [], "section": "Trading and execution", "v1": false, "def": "How easily you can buy or sell without moving the price. Large caps are liquid, while tiny stocks may not be."}, {"id": "lot-size", "term": "Lot size", "aliases": ["Lot size"], "link": ["Lot size"], "section": "Trading and execution", "v1": false, "def": "The fixed quantity futures and options trade in, e.g. 1 lot = 250 shares. Not needed for stocks."}, {"id": "backtest", "term": "Backtest", "aliases": ["Backtest"], "link": ["Backtest"], "section": "Backtesting and performance", "v1": true, "def": "Running a rule over past data to see how it <em>would have</em> performed. It's evidence, not a promise."}, {"id": "system", "term": "System / strategy", "aliases": ["System", "strategy"], "link": [], "section": "Backtesting and performance", "v1": true, "def": "A complete set of rules: what to buy, when to buy, when to sell, how much. Kanso's System Builder makes these."}, {"id": "scanner", "term": "Scanner / screener", "aliases": ["Scanner", "screener"], "link": ["Scanner", "screener"], "section": "Backtesting and performance", "v1": true, "def": "A tool that lists stocks matching rules <em>today</em>. A backtest asks the same question about the <em>past</em>."}, {"id": "look-ahead-bias", "term": "Look-ahead bias", "aliases": ["Look-ahead bias"], "link": ["Look-ahead bias"], "section": "Backtesting and performance", "v1": true, "def": "Accidentally using information you couldn't have had at the time, e.g. buying at a close you only learn after the market shuts. It makes backtests look far better than reality, and Kanso has a test that checks it never happens."}, {"id": "survivorship-bias", "term": "Survivorship bias", "aliases": ["Survivorship bias"], "link": ["Survivorship bias"], "section": "Backtesting and performance", "v1": true, "def": "Testing only stocks that still exist today, which silently drops the companies that failed or were removed from the index. That flatters results, so Kanso shows a warning."}, {"id": "overfitting", "term": "Overfitting / curve fitting", "aliases": ["Overfitting", "curve fitting"], "link": ["Overfitting", "curve fitting"], "section": "Backtesting and performance", "v1": true, "def": "Tweaking settings until the past looks perfect. The \"best\" settings are then often just luck. Kanso counts how many variations you've tried."}, {"id": "in-sample", "term": "In-sample / out-of-sample", "aliases": ["In-sample", "out-of-sample"], "link": ["In-sample", "out-of-sample"], "section": "Backtesting and performance", "v1": false, "def": "The data you tuned on vs fresh data you didn't touch. Good results out-of-sample are much more convincing."}, {"id": "equity-curve", "term": "Equity curve", "aliases": ["Equity curve"], "link": ["Equity curve"], "section": "Backtesting and performance", "v1": true, "def": "A chart of your account value over time."}, {"id": "benchmark", "term": "Benchmark", "aliases": ["Benchmark"], "link": [], "section": "Backtesting and performance", "v1": true, "def": "What you compare against, usually buy-and-hold Nifty 50. If you can't beat it, just buy the index."}, {"id": "buy-and-hold", "term": "Buy and hold", "aliases": ["Buy and hold"], "link": ["Buy and hold"], "section": "Backtesting and performance", "v1": true, "def": "Buy once and never sell. The simplest benchmark."}, {"id": "return", "term": "Return / % gain", "aliases": ["Return", "% gain"], "link": ["% gain"], "section": "Backtesting and performance", "v1": true, "def": "(Sell price − buy price) ÷ buy price, after costs."}, {"id": "cagr", "term": "CAGR", "aliases": ["CAGR"], "link": ["CAGR"], "section": "Backtesting and performance", "v1": true, "def": "Compound Annual Growth Rate: the steady yearly return that would turn your start value into your end value."}, {"id": "drawdown", "term": "Drawdown / max drawdown (MDD)", "aliases": ["Drawdown", "max drawdown", "MDD"], "link": ["Drawdown", "max drawdown", "MDD"], "section": "Backtesting and performance", "v1": true, "def": "The fall from a peak to a later low. The max drawdown is the worst such fall, and it measures how painful the ride was. −25% means your account was at one point 25% below its best."}, {"id": "win-rate", "term": "Win rate", "aliases": ["Win rate"], "link": ["Win rate"], "section": "Backtesting and performance", "v1": true, "def": "% of trades that made money. Breakout systems often win <strong>under half</strong> the time, yet still profit because the winners are much bigger than the losers."}, {"id": "average-win", "term": "Average win / average loss", "aliases": ["Average win", "average loss"], "link": ["Average win", "average loss"], "section": "Backtesting and performance", "v1": true, "def": "Typical % gain on winners vs typical % loss on losers."}, {"id": "expectancy", "term": "Expectancy", "aliases": ["Expectancy"], "link": ["Expectancy"], "section": "Backtesting and performance", "v1": true, "def": "Average result per trade, winners and losers combined. Positive means the system makes money on average."}, {"id": "exposure", "term": "Exposure", "aliases": ["Exposure"], "link": ["Exposure"], "section": "Backtesting and performance", "v1": true, "def": "% of the time money was actually invested in stocks."}, {"id": "holding-period", "term": "Holding period", "aliases": ["Holding period"], "link": ["Holding period"], "section": "Backtesting and performance", "v1": true, "def": "How long a trade lasted."}, {"id": "sharpe-ratio", "term": "Sharpe ratio", "aliases": ["Sharpe ratio"], "link": ["Sharpe ratio"], "section": "Backtesting and performance", "v1": false, "def": "Return per unit of volatility. Higher means a smoother ride for the return."}, {"id": "profit-factor", "term": "Profit factor", "aliases": ["Profit factor"], "link": ["Profit factor"], "section": "Backtesting and performance", "v1": false, "def": "Total gains ÷ total losses. Above 1 = profitable."}, {"id": "oracle", "term": "Oracle / benchmark test (Kanso)", "aliases": ["Oracle", "benchmark test", "Kanso"], "link": ["Oracle", "benchmark test"], "section": "Backtesting and performance", "v1": true, "def": "Running the same rule in vectorbt and checking that Kanso gets the same trades. A correctness check, not a performance one."}, {"id": "renko", "term": "Renko", "aliases": ["Renko"], "link": ["Renko"], "section": "Alternative chart types (V2)", "v1": false, "def": "Price drawn as equal-sized bricks. A new brick appears only when the price moves by the brick size, so time and small moves are ignored."}, {"id": "brick-size", "term": "Brick size", "aliases": ["Brick size"], "link": ["Brick size"], "section": "Alternative chart types (V2)", "v1": false, "def": "How far the price must move to draw a new Renko brick (fixed ₹ or ATR-based)."}, {"id": "point-figure", "term": "Point & Figure (P&F)", "aliases": ["Point & Figure", "P&F"], "link": ["Point & Figure", "P&F"], "section": "Alternative chart types (V2)", "v1": false, "def": "Columns of X's (rising) and O's (falling) on a grid. A new column starts only after a reversal of several boxes. It shows support and resistance very clearly."}, {"id": "box-size", "term": "Box size / reversal", "aliases": ["Box size", "reversal"], "link": ["Box size", "reversal"], "section": "Alternative chart types (V2)", "v1": false, "def": "P&amp;F settings: how big each X or O is, and how many boxes against the trend start a new column (often 3)."}, {"id": "double-top-buy", "term": "Double top buy (P&F)", "aliases": ["Double top buy", "P&F"], "link": ["Double top buy"], "section": "Alternative chart types (V2)", "v1": false, "def": "An X column rising one box above the previous X column's top: P&amp;F's version of a breakout."}, {"id": "kagi", "term": "Kagi / Line break", "aliases": ["Kagi", "Line break"], "link": ["Kagi", "Line break"], "section": "Alternative chart types (V2)", "v1": false, "def": "Other price-only chart styles RZone supports. Not planned for Kanso."}, {"id": "f-o", "term": "F&O", "aliases": ["F&O"], "link": ["F&O"], "section": "Derivatives (not in V1, but you'll hear these)", "v1": false, "def": "Futures &amp; Options, India's derivatives market."}, {"id": "futures", "term": "Futures", "aliases": ["Futures"], "link": [], "section": "Derivatives (not in V1, but you'll hear these)", "v1": false, "def": "A contract to buy or sell at a set price on a future date. It's leveraged: small price moves mean big gains or losses."}, {"id": "options", "term": "Options: call / put", "aliases": ["Options", "call", "put"], "link": [], "section": "Derivatives (not in V1, but you'll hear these)", "v1": false, "def": "A call is the right (not obligation) to buy at a set price; a put is the right to sell."}, {"id": "expiry", "term": "Expiry", "aliases": ["Expiry"], "link": [], "section": "Derivatives (not in V1, but you'll hear these)", "v1": false, "def": "When a futures or options contract ends. Indian stock F&amp;O expires monthly."}, {"id": "rollover", "term": "Rollover", "aliases": ["Rollover"], "link": [], "section": "Derivatives (not in V1, but you'll hear these)", "v1": false, "def": "Closing an expiring contract and opening the next month's one."}, {"id": "margin", "term": "Margin", "aliases": ["Margin"], "link": [], "section": "Derivatives (not in V1, but you'll hear these)", "v1": false, "def": "Money the broker blocks as a deposit to hold a leveraged position."}, {"id": "leverage", "term": "Leverage", "aliases": ["Leverage"], "link": [], "section": "Derivatives (not in V1, but you'll hear these)", "v1": false, "def": "Controlling more money than you put in. It multiplies both gains and losses."}, {"id": "iv", "term": "IV (implied volatility)", "aliases": ["IV", "implied volatility"], "link": ["IV", "implied volatility"], "section": "Derivatives (not in V1, but you'll hear these)", "v1": false, "def": "The volatility the options market expects. A big driver of option prices."}, {"id": "greeks", "term": "Greeks", "aliases": ["Greeks"], "link": ["Greeks"], "section": "Derivatives (not in V1, but you'll hear these)", "v1": false, "def": "Delta, gamma, theta, vega: measures of how an option's price reacts to changes in price, time and volatility."}, {"id": "tradingview", "term": "TradingView", "aliases": ["TradingView"], "link": [], "section": "Tools mentioned in Kanso", "v1": false, "def": "A popular charting website. <strong>Pine Script</strong> is its language for indicators and strategies, and the <strong>Strategy Tester</strong> backtests one stock at a time."}, {"id": "chartink", "term": "Chartink", "aliases": ["Chartink"], "link": [], "section": "Tools mentioned in Kanso", "v1": false, "def": "A free Indian stock screener with a scan builder."}, {"id": "pkscreener", "term": "PKScreener", "aliases": ["PKScreener"], "link": [], "section": "Tools mentioned in Kanso", "v1": false, "def": "An open-source NSE screener with 40+ built-in scans (runs via Docker)."}, {"id": "rzone", "term": "RZone / TradePoint", "aliases": ["RZone", "TradePoint"], "link": ["RZone", "TradePoint"], "section": "Tools mentioned in Kanso", "v1": false, "def": "Definedge's research and charting tools: the inspiration for Kanso."}, {"id": "vectorbt", "term": "vectorbt", "aliases": ["vectorbt"], "link": [], "section": "Tools mentioned in Kanso", "v1": false, "def": "A fast Python backtesting library. Kanso uses it as an independent correctness check."}, {"id": "eod2", "term": "eod2 / stock-pattern", "aliases": ["eod2", "stock-pattern"], "link": ["eod2", "stock-pattern"], "section": "Tools mentioned in Kanso", "v1": false, "def": "An open-source NSE data downloader and a chart-pattern detector."}, {"id": "yfinance", "term": "yfinance / Yahoo Finance", "aliases": ["yfinance", "Yahoo Finance"], "link": ["yfinance", "Yahoo Finance"], "section": "Tools mentioned in Kanso", "v1": false, "def": "A free (unofficial) source of historical prices. Kanso V1's data source."}]};
const byId = new Map(DATA.terms.map(t => [t.id, t]));
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

// --- auto-link other terms inside definitions -------------------------------
const targets = [];
for (const t of DATA.terms) for (const a of t.link) targets.push({ a, id: t.id, cs: a.length <= 3 || a === a.toUpperCase() });
targets.sort((x, y) => y.a.length - x.a.length);
const mk = list => list.length ? new RegExp(`(?<![A-Za-z0-9])(${list.map(x => esc(x.a)).join("|")})(?:s|es)?(?![A-Za-z0-9])`, list[0].cs ? "g" : "gi") : null;
const reCI = mk(targets.filter(x => !x.cs)), reCS = mk(targets.filter(x => x.cs));
const lookup = new Map(targets.map(x => [x.cs ? x.a : x.a.toLowerCase(), x.id]));

function linkify(el, selfId) {
  const used = new Set([selfId]);
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest("code,a") ? 2 : 1 });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue, parts = []; let pos = 0;
    while (pos < text.length) {
      let best = null;
      for (const re of [reCI, reCS]) {
        if (!re) continue; re.lastIndex = pos;
        let m;
        while ((m = re.exec(text))) {
          const id = lookup.get(re.flags.includes("i") ? m[1].toLowerCase() : m[1]);
          if (id && !used.has(id)) { if (!best || m.index < best.i) best = { i: m.index, len: m[0].length, id }; break; }
        }
      }
      if (!best) break;
      parts.push(text.slice(pos, best.i));
      const a = document.createElement("a");
      a.className = "xref"; a.href = "#" + best.id; a.dataset.id = best.id; a.textContent = text.substr(best.i, best.len);
      parts.push(a); used.add(best.id); pos = best.i + best.len;
    }
    if (!parts.length) continue;
    parts.push(text.slice(pos));
    node.replaceWith(...parts.map(p => typeof p === "string" ? document.createTextNode(p) : p));
  }
}

// --- render ------------------------------------------------------------------
const body = $("#body"), jumps = $("#jumps");
DATA.sections.forEach((name, i) => {
  const sid = "s-" + (i + 1);
  const sec = document.createElement("section"); sec.className = "sec"; sec.id = sid; sec.dataset.section = name;
  sec.innerHTML = `<h2>${name}</h2><div class="list"></div>`;
  const list = sec.querySelector(".list");
  for (const t of DATA.terms.filter(t => t.section === name)) {
    const row = document.createElement("article"); row.className = "entry"; row.id = t.id;
    row.dataset.search = (t.term + " " + t.aliases.join(" ") + " " + t.def.replace(/<[^>]+>/g, "")).toLowerCase();
    row.dataset.v1 = t.v1 ? "1" : "";
    row.innerHTML = `<h3><a class="self" href="#${t.id}">${t.term}</a>${t.v1 ? '<span class="v1" title="Used by Kanso V1">V1</span>' : ""}</h3><p class="def">${t.def}</p>`;
    linkify(row.querySelector(".def"), t.id);
    list.append(row);
  }
  body.append(sec);
  const j = document.createElement("a"); j.href = "#" + sid; j.textContent = name; jumps.append(j);
});
const empty = document.createElement("p"); empty.className = "empty"; empty.hidden = true; empty.textContent = "No terms match. Try a shorter word."; body.append(empty);

// --- filter ------------------------------------------------------------------
const q = $("#q"), v1only = $("#v1only"), count = $("#count");
try { v1only.checked = localStorage.getItem("kanso.glossary.v1") === "1" } catch {}
function apply() {
  const s = q.value.trim().toLowerCase(); let shown = 0;
  for (const sec of document.querySelectorAll("section.sec")) {
    let any = 0;
    for (const r of sec.querySelectorAll(".entry")) {
      const ok = (!s || r.dataset.search.includes(s)) && (!v1only.checked || r.dataset.v1);
      r.hidden = !ok; if (ok) any++;
    }
    sec.hidden = !any; shown += any;
  }
  empty.hidden = shown > 0;
  count.textContent = `${shown} of ${DATA.terms.length} terms`;
}
q.addEventListener("input", apply);
v1only.addEventListener("change", () => { try { localStorage.setItem("kanso.glossary.v1", v1only.checked ? "1" : "0") } catch {} apply() });
apply();

// --- popover -----------------------------------------------------------------
const pop = $("#pop"); let popFor = null, hideT;
function show(a) {
  const t = byId.get(a.dataset.id); if (!t) return;
  clearTimeout(hideT); popFor = a;
  pop.innerHTML = `<div class="t">${t.term}${t.v1 ? '<span class="s">V1</span>' : ""}</div><div>${t.def}</div><a class="go" href="#${t.id}">Go to entry →</a>`;
  pop.hidden = false;
  const r = a.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(Math.max(16, r.left), innerWidth - pw - 16);
  let y = r.bottom + 8; if (y + ph > innerHeight - 16) y = Math.max(16, r.top - ph - 8);
  pop.style.left = x + "px"; pop.style.top = y + "px";
}
function hide(now) { clearTimeout(hideT); hideT = setTimeout(() => { pop.hidden = true; popFor = null }, now ? 0 : 120) }
body.addEventListener("pointerover", e => { const a = e.target.closest("a.xref"); if (a && e.pointerType !== "touch") show(a) });
body.addEventListener("pointerout", e => { if (e.target.closest("a.xref")) hide() });
body.addEventListener("focusin", e => { const a = e.target.closest("a.xref"); if (a) show(a) });
body.addEventListener("focusout", e => { if (e.target.closest("a.xref")) hide() });
body.addEventListener("click", e => {
  const a = e.target.closest("a.xref"); if (!a) return;
  if (matchMedia("(hover: none)").matches && popFor !== a) { e.preventDefault(); show(a) }
});
pop.addEventListener("pointerenter", () => clearTimeout(hideT));
pop.addEventListener("pointerleave", () => hide());
document.addEventListener("keydown", e => { if (e.key === "Escape") hide(true) });
document.addEventListener("pointerdown", e => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest("a.xref")) hide(true) });
addEventListener("scroll", () => { if (!pop.hidden) hide(true) }, { passive: true });

// --- hash navigation ---------------------------------------------------------
function goHash() {
  const id = decodeURIComponent(location.hash.slice(1)); if (!id) return;
  const el = document.getElementById(id); if (!el) return;
  if (el.hidden || el.closest("[hidden]")) { q.value = ""; v1only.checked = false; apply() }
  hide(true);
  el.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  if (el.classList.contains("entry")) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400) }
}
addEventListener("hashchange", goHash);
goHash();
</script>
